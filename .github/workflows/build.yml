name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RaniaSIRApp.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Build APK
        run: |
          mkdir project
          unzip -q RaniaSIRApp.zip -d project
          SETTINGS=$(find project -name settings.gradle | head -1)
          ROOT=$(dirname "$SETTINGS")
          gradle -p "$ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaniaSIRApp-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
